<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480">
  <rect width="920" height="480" rx="28" fill="#f6fbfb"/>
  <g stroke="#d7e4e7" stroke-width="1">
    <path d="M60 96h800M60 200h800M60 304h800M60 408h800"/>
    <path d="M164 40v400M344 40v400M524 40v400M704 40v400"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="60" y="56" font-size="18" font-weight="700" fill="#103038">MICOS pipeline overview</text>
    <text x="60" y="82" font-size="13" fill="#4e6871">From raw FASTQ to interpretable microbiome outputs</text>
  </g>
  <g>
    <rect x="60" y="120" width="180" height="220" rx="20" fill="#ffffff" stroke="#cadadd"/>
    <text x="84" y="160" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#0f766e">STAGE 01</text>
    <text x="84" y="192" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#11232b">QC</text>
    <text x="84" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4f6971">FastQC, KneadData, trimming, host depletion.</text>
    <text x="84" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">Output</text>
    <text x="84" y="312" font-family="Inter, Arial, sans-serif" font-size="14" fill="#28414a">clean reads</text>
  </g>
  <g>
    <rect x="280" y="120" width="180" height="220" rx="20" fill="#ffffff" stroke="#cadadd"/>
    <text x="304" y="160" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#0f766e">STAGE 02</text>
    <text x="304" y="192" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#11232b">Taxonomy</text>
    <text x="304" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4f6971">Kraken2, kraken-biom, Krona summaries.</text>
    <text x="304" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">Output</text>
    <text x="304" y="312" font-family="Inter, Arial, sans-serif" font-size="14" fill="#28414a">reports, biom, krona</text>
  </g>
  <g>
    <rect x="500" y="120" width="180" height="220" rx="20" fill="#ffffff" stroke="#cadadd"/>
    <text x="524" y="160" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#0f766e">STAGE 03</text>
    <text x="524" y="192" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#11232b">Diversity</text>
    <text x="524" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4f6971">QIIME2 metrics, alpha and beta views, metadata joins.</text>
    <text x="524" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#0f766e">Output</text>
    <text x="524" y="312" font-family="Inter, Arial, sans-serif" font-size="14" fill="#28414a">ordination and tables</text>
  </g>
  <g>
    <rect x="720" y="120" width="140" height="220" rx="20" fill="#ffffff" stroke="#cadadd"/>
    <text x="744" y="160" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#0f766e">STAGE 04</text>
    <text x="744" y="192" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#11232b">Report</text>
    <text x="744" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#4f6971">Functional outputs and final summary views.</text>
