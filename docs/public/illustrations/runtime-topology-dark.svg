<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480">
  <rect width="920" height="480" rx="28" fill="#111c22"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="56" y="58" font-size="18" font-weight="700" fill="#e8f2f2">Runtime topology</text>
    <text x="56" y="82" font-size="13" fill="#a8c1c3">The repository blends Python orchestration, shell wrappers, WDL stages, and container assets.</text>
  </g>
  <rect x="56" y="118" width="232" height="120" rx="20" fill="#18262d" stroke="#31424a"/>
  <text x="84" y="154" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#59d0c2">ENTRY LAYER</text>
  <text x="84" y="186" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#eff7f7">micos CLI</text>
  <text x="84" y="216" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">Click-based commands, validation, dry-run, and module entrypoints.</text>
  <rect x="344" y="118" width="232" height="120" rx="20" fill="#18262d" stroke="#31424a"/>
  <text x="372" y="154" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#59d0c2">ORCHESTRATION</text>
  <text x="372" y="186" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#eff7f7">Python modules</text>
  <text x="372" y="216" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">Full pipeline, quality control, taxonomy, diversity, functional analysis, reporting.</text>
  <rect x="632" y="118" width="232" height="120" rx="20" fill="#18262d" stroke="#31424a"/>
  <text x="660" y="154" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#59d0c2">WORKFLOW ASSETS</text>
  <text x="660" y="186" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#eff7f7">steps/ + containers/</text>
  <text x="660" y="216" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">WDL stages, Singularity definitions, Docker Compose example services.</text>
  <rect x="140" y="298" width="232" height="116" rx="20" fill="#18262d" stroke="#31424a"/>
  <text x="168" y="334" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#59d0c2">CONFIG SURFACE</text>
  <text x="168" y="366" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#eff7f7">config/*.template</text>
  <text x="168" y="396" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">Project, database, and sample metadata templates.</text>
  <rect x="548" y="298" width="232" height="116" rx="20" fill="#18262d" stroke="#31424a"/>
  <text x="576" y="334" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing=".12em" fill="#59d0c2">POWER USER SURFACE</text>
  <text x="576" y="366" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#eff7f7">scripts/</text>
  <text x="576" y="396" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">Thin wrappers plus experimental analyses outside the stable CLI core.</text>
  <g fill="none" stroke="#59d0c2" stroke-linecap="round" stroke-width="4">
    <path d="M288 178h56"/>
    <path d="M576 178h56"/>
    <path d="M460 238v48"/>
    <path d="M256 298v-48h204"/>
    <path d="M664 298v-48H460"/>
  </g>
  <g fill="#59d0c2">
    <path d="M336 169l16 9-16 9z"/>
    <path d="M624 169l16 9-16 9z"/>
    <path d="M451 278l9 16 9-16z"/>
  </g>
</svg>
