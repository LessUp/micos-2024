    <text x="304" y="192" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#eff7f7">Taxonomy</text>
    <text x="304" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">Kraken2, kraken-biom, Krona summaries.</text>
    <text x="304" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#59d0c2">Output</text>
    <text x="304" y="312" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d7e7e7">reports, biom, krona</text>
  </g>
  <g>
