    <text x="84" y="222" font-family="Inter, Arial, sans-serif" font-size="14" fill="#b7cdcf">FastQC, KneadData, trimming, host depletion.</text>
    <text x="84" y="288" font-family="Inter, Arial, sans-serif" font-size="13" fill="#59d0c2">Output</text>
    <text x="84" y="312" font-family="Inter, Arial, sans-serif" font-size="14" fill="#d7e7e7">clean reads</text>
  </g>
  <g>
    <rect x="280" y="120" width="180" height="220" rx="20" fill="#18262d" stroke="#31424a"/>
