<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="url(#faviconGradient)"/>
  <!-- Simplified DNA helix -->
  <path d="M11 6 Q7 11 11 16 Q15 21 11 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M21 6 Q25 11 21 16 Q17 21 21 26" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base pairs -->
  <line x1="12" y1="10" x2="20" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="10" y1="16" x2="22" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <line x1="12" y1="22" x2="20" y2="22" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Central dot -->
  <circle cx="16" cy="16" r="2" fill="white"/>
</svg>
