# =============================================================================
# Dependabot Configuration
# 自动更新 pip 依赖、GitHub Actions 版本和 Docker 基础镜像
# =============================================================================

version: 2

updates:
  # Python 依赖 (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-deps:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
          - "isort"
          - "pre-commit"

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"

  # Docker (steps/*/Dockerfile) - 仅配置含 Dockerfile 的步骤
  - package-ecosystem: "docker"
    directory: "/steps/03_taxonomic_profiling_kraken"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/steps/04_taxonomic_conversion_biom"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/steps/05_taxonomic_visualization_krona"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/steps/06_qiime2_analysis"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "docker"
    directory: "/steps/07_phyloseq_analysis"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
