# MkDocs 配置文件 - ReadTheDocs 主题

site_name: MICOS-2024
site_description: Metagenomic Intelligence and Comprehensive Omics Suite - 宏基因组综合分析平台
site_url: https://lessup.github.io/micos-2024/
site_author: MICOS-2024 Team

# 仓库设置
repo_url: https://github.com/LessUp/micos-2024
repo_name: LessUp/micos-2024
edit_uri: edit/master/docs/

# 版权
copyright: Copyright &copy; 2024-2025 MICOS-2024 Team

# ==================== 文档结构 ====================
nav:
  - Home: index.md
  - English:
    - en/index.md
    - Installation: en/installation.md
    - Configuration: en/configuration.md
    - Taxonomic Profiling: en/taxonomic-profiling.md
    - Functional Profiling: en/functional-profiling.md
    - Diversity Analysis: en/diversity-analysis.md
    - API Reference: en/api-reference.md
    - FAQ: en/faq.md
    - Troubleshooting: en/troubleshooting.md
  - 中文:
    - zh/index.md
    - 安装指南: zh/installation.md
    - 配置指南: zh/configuration.md
    - 物种分类分析: zh/taxonomic-profiling.md
    - 功能注释分析: zh/functional-profiling.md
    - 多样性分析: zh/diversity-analysis.md
    - API 参考: zh/api-reference.md
    - 常见问题: zh/faq.md
    - 故障排除: zh/troubleshooting.md

# ==================== 主题配置 ====================
theme:
  name: readthedocs
  locale: en
  highlightjs: true
  hljs_languages:
    - bash
    - python
    - yaml

# ==================== 插件 ====================
plugins:
  - search:
      lang:
        - en
        - zh

# ==================== 扩展 ====================
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - def_list
  - footnotes
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false

# ==================== 额外配置 ====================
extra:
  version: 1.0
