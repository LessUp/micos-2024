# MkDocs 配置文件 - ReadTheDocs 主题 + i18n

site_name: MICOS-2024
site_description: Metagenomic Intelligence and Comprehensive Omics Suite
site_url: https://lessup.github.io/micos-2024/
site_author: MICOS-2024 Team

# 仓库设置
repo_url: https://github.com/LessUp/micos-2024
repo_name: LessUp/micos-2024
edit_uri: edit/master/docs/

# 版权
copyright: Copyright &copy; 2024-2025 MICOS-2024 Team

# ==================== 文档结构 ====================
nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Taxonomic Profiling: taxonomic-profiling.md
  - Functional Profiling: functional-profiling.md
  - Diversity Analysis: diversity-analysis.md
  - API Reference: api-reference.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md

# ==================== 主题配置 ====================
theme:
  name: readthedocs
  locale: en
  highlightjs: true
  hljs_languages:
    - bash
    - python
    - yaml

# ==================== 插件 ====================
plugins:
  - i18n:
      default_language: en
      docs_structure: suffix
      languages:
        en: English
        zh: 中文
      nav_translations:
        zh:
          Home: 首页
          Installation: 安装指南
          Configuration: 配置指南
          Taxonomic Profiling: 物种分类分析
          Functional Profiling: 功能注释分析
          Diversity Analysis: 多样性分析
          API Reference: API 参考
          FAQ: 常见问题
          Troubleshooting: 故障排除
  - search:
      lang:
        - en
        - zh

# ==================== 扩展 ====================
markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - def_list
  - footnotes
  - tables
  - fenced_code

# ==================== 额外配置 ====================
extra:
  version: 1.0
